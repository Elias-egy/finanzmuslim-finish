# Holt jede Nacht die Kurse, prueft sie und committet sie, wenn sich etwas
# geaendert hat. Danach wird die Seite neu gebaut und ausgeliefert, aber nur
# wenn die Repository-Variable PAGES_LIVE auf true steht.
#
# Warum ueberhaupt: src/data/kurse.json ist eine Datei im Repo, keine Abfrage
# zur Laufzeit. "Taeglich aktuell" heisst deshalb, dass jemand das Skript
# taeglich laufen laesst, das Ergebnis committet und daraus eine neue
# Auslieferung baut. Genau diese drei Schritte macht dieser Lauf.
#
# Der Schalter: Settings, Secrets and variables, Actions, Variables,
# PAGES_LIVE = true. Solange die Variable fehlt oder anders lautet, wird
# nur committet und NICHTS veroeffentlicht. Das ist der Standard.
name: Kurse holen

on:
  schedule:
    # 03:17 UTC. Krumme Minute mit Absicht: zur vollen Stunde stehen bei
    # GitHub Zehntausende Laeufe in der Warteschlange, das verzoegert um
    # bis zu einer Stunde.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Nie zwei Laeufe gleichzeitig, sonst schreiben beide dieselbe Datei.
concurrency:
  group: kurse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    outputs:
      geaendert: ${{ steps.commit.outputs.geaendert }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node wird nur fuer die Abdeckungspruefung gebraucht, die liest die
      # Anlagenliste aus TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      # Das Kursskript selbst kommt mit der Standardbibliothek aus.
      - name: Kurse holen
        run: python3 scripts/kurse_holen.py

      # Sicherheitsnetz gegen halbe Dateien. Eine kaputte Datei waere
      # schlimmer als die von gestern, deshalb wird bei Fehlern nicht
      # committet und die alten Daten bleiben stehen.
      - name: Datei plausibel?
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("src/data/kurse.json"))
          anlagen, krypto = d["anlagen"], d["krypto"]
          print(f"{len(anlagen)} Anlagen, {len(krypto)} Muenzen, Stand {d['stand']}")
          if len(anlagen) < 23 or len(krypto) < 4:
              sys.exit(f"Zu wenige Eintraege: {len(anlagen)} Anlagen, {len(krypto)} Muenzen")
          json.load(open("src/data/nisab.json"))
          PY

      # Prueft von der Seite der Website aus, ob wirklich jede der 27 Anlagen
      # aus halalAnlagen ihren Kurs bekommt. Schlaegt fehl, sobald eine Anlage
      # gar keinen Eintrag hat, mehr als zwei ohne Kurs dastehen oder ein
      # Fonds ohne Jahresrendite ist, obwohl er alt genug waere.
      - name: Abdeckung aller 27 Anlagen pruefen
        run: npm run kurse:pruefen

      - name: Committen, wenn sich etwas geaendert hat
        id: commit
        run: |
          if git diff --quiet -- src/data/kurse.json src/data/nisab.json; then
            echo "Keine Aenderung, nichts zu committen."
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "finanzmuslim Kursbot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/kurse.json src/data/nisab.json
          git commit -m "Kurse vom $(date -u +%d.%m.%Y)"
          git push
          echo "geaendert=true" >> "$GITHUB_OUTPUT"

  # Neu bauen und ausliefern, aber nur wenn sich wirklich etwas geaendert hat
  # UND die Variable PAGES_LIVE auf true steht. Fehlt die Variable, wird der
  # Job uebersprungen. Das ist der Standard.
  ausliefern:
    needs: holen
    if: needs.holen.outputs.geaendert == 'true' && vars.PAGES_LIVE == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/auslieferung.yml
    with:
      veroeffentlichen: true
      # Ausdruecklich der Stand NACH dem Kurs-Commit. Ohne das baut der Lauf
      # den Stand von vorher und die neuen Kurse gehen gar nicht raus.
      ref: main
